seed: 42
experiment_name: "QMSC_Late_Fusion"
run_name: "Single Noiseless"
model_name: "random_single_noisless" # <q layers type>_<n devices>_<noise apply strategy>

datasets:
  hidden-manifold:
    data_path: "datasets/hidden-manifold/"
    dim: 6
    diff: False

reservoir:
  num_qubits: 6
  depth: 2

training:
  solver: "adam"
  activation: "logistic" # {'logistic', 'relu', 'identity', 'tanh'}
  hidden_layer_sizes: []
  max_iter: 300
  learning_rate: "constant"
  learning_rate_init: 0.01
  early_stopping: True
  n_folds: 5

evaluation:
  scoring: ["accuracy", "f1"]